# Spike SP01: gera o APK de release assinado. Descartável junto com a branch.
name: spike-apk
on:
  workflow_dispatch:
  push:
    branches: ['spike/**']

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Preparar assinatura (segredos só por variável de ambiente)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > "$RUNNER_TEMP/assinar.gradle" <<'GRADLE'
          allprojects {
            afterEvaluate { p ->
              if (p.plugins.hasPlugin('com.android.application')) {
                p.android {
                  signingConfigs {
                    spikeRelease {
                      storeFile file(System.getenv('KEYSTORE_PATH'))
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                    }
                  }
                  buildTypes.release.signingConfig signingConfigs.spikeRelease
                }
              }
            }
          }
          GRADLE
      - name: Gradle assembleRelease
        working-directory: app/android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
        run: ./gradlew assembleRelease --init-script "$RUNNER_TEMP/assinar.gradle" --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nutrifit-spike-apk
          path: app/android/app/build/outputs/apk/release/*.apk
