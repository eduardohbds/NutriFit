# Gera o APK de release assinado a cada tag de versão (arquitetura 13.1).
# Os segredos ANDROID_KEYSTORE_* passam só por `env:`; nenhum comando os imprime.
name: apk
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Gravar o keystore fora do repositório e preparar a assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          base64 -d <<< "$KEYSTORE_B64" > "$RUNNER_TEMP/release.jks"
          cat > "$RUNNER_TEMP/assinar.gradle" <<'GRADLE'
          allprojects {
            afterEvaluate { p ->
              if (p.plugins.hasPlugin('com.android.application')) {
                p.android {
                  signingConfigs {
                    nutrifitRelease {
                      storeFile file(System.getenv('KEYSTORE_PATH'))
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                    }
                  }
                  buildTypes.release.signingConfig signingConfigs.nutrifitRelease
                }
              }
            }
          }
          GRADLE
      - name: Gradle assembleRelease
        working-directory: app/android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
        run: ./gradlew assembleRelease --init-script "$RUNNER_TEMP/assinar.gradle" --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nutrifit-apk
          path: app/android/app/build/outputs/apk/release/*.apk

  # Publica o APK numa Release pública com o nome da tag (US-044). A escrita no repositório fica
  # só aqui; o job apk acima só lê. Sem segredo do keystore: este job só recebe o APK já assinado.
  release:
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nutrifit-apk
          path: apk
      - name: Criar a Release (se não existir) e anexar o APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --verify-tag --title "$TAG" \
              --notes "APK de release assinado da versão $TAG."
          fi
          gh release upload "$TAG" apk/*.apk --repo "$REPO" --clobber
